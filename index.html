/* V266 – ruhige Raumgruppen in Heute, Kalender und Bald fällig */

.catalogRoomGroup{margin:0 0 14px;border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}

.roomGroup .task:last-child .taskContent{border-bottom:0}
.roomViewIntro{font-size:11px;color:var(--muted);margin:4px 4px 8px}
.room-kueche .roomStripe{background:#7e9db2}.room-bad .roomStripe{background:#8fa88f}.room-wohnen .roomStripe{background:#b49a78}.room-schlaf .roomStripe{background:#9c8eaa}.room-kind .roomStripe{background:#c39483}.room-arbeits .roomStripe{background:#8797a8}.room-flur .roomStripe{background:#aaa08d}.room-keller .roomStripe{background:#8f8b84}.room-sonst .roomStripe{background:#b0aaa3}

/* V286 · Soft Neoclassical — reines Design-Update, Planungslogik unverändert */
:root{
  --bg:#f7f2eb;
  --card:#fffdf9;
  --ink:#302d2a;
  --muted:#81766d;
  --line:#e8ddd2;
  --accent:#9d8876;
  --accent2:#f0e7dc;
  --green:#e8f0e6;
  --greenInk:#4e7358;
  --shadow:0 8px 24px rgba(76,58,43,.07);
}
body{background:linear-gradient(180deg,#faf6f0 0%,#f6f0e8 100%);color:var(--ink)}
.app{max-width:900px;padding:20px 14px 80px}

.tab{flex:0 0 auto;border:1px solid var(--line);background:rgba(255,253,249,.92);padding:9px 14px;border-radius:17px;font-weight:700;font-size:14px;color:#6f645b;box-shadow:0 2px 8px rgba(76,58,43,.03)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 5px 12px rgba(112,89,70,.14)}
.card{border:1px solid rgba(225,213,201,.9);border-radius:22px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow);background:rgba(255,253,249,.96)}

.topline{gap:8px}
.hero h2,.hero h3{font-family:Georgia,'Times New Roman',serif}
.badge{background:#eee5da;padding:7px 10px;border-radius:14px;font-size:13px}
.progress{height:7px;background:#ece3da;border-radius:99px;margin:11px 0}
.progress>i{background:var(--accent)}
.actions{gap:6px;margin-top:10px}
.btn{border:1px solid var(--line);background:#fffdfa;padding:8px 11px;border-radius:14px;font-size:13px;font-weight:700;color:#62574e}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.notice{padding:11px 13px;border-radius:16px;margin-top:10px}
.sectionTitle{font-family:Georgia,'Times New Roman',serif;font-size:19px;font-weight:600;margin:16px 3px 7px}
.task{min-height:53px;margin:5px 0}
.taskContent{gap:8px;padding:8px 9px;min-height:53px;border-radius:16px;background:#fffdfa;border-color:#eadfd5}
.check{width:23px;height:23px;flex-basis:23px;border-color:#cfc0b2}
.taskMain{padding-right:2px}
.taskName{font-weight:700;font-size:14px;line-height:1.2}
.meta{font-size:10px;margin-top:2px;color:#8b8077}
.taskButtons{gap:4px}
.actionTextBtn{width:30px;height:30px;font-size:16px;border-radius:10px;background:#f0e8de;color:#6c5e53}
.iconBtn{border:0;background:#f0e8de;border-radius:10px;padding:6px 8px;font-size:12px}
.roomGroup{margin:0 0 10px;border:1px solid #e7dbd0;border-radius:17px;background:rgba(255,253,249,.9);box-shadow:0 5px 16px rgba(76,58,43,.045)}
.roomGroupHead{padding:8px 10px;gap:7px;background:linear-gradient(90deg,#faf5ee,#fffdf9);border-bottom:1px solid #eee4db}
.roomStripe{width:3px;height:19px;border-radius:4px;background:#a99380}
.roomGroupName{font-family:Georgia,'Times New Roman',serif;font-size:13px;letter-spacing:.03em;color:#4a4038}
.roomGroupCount{font-size:10px;color:#8a7e74}
.roomGroup .task{min-height:49px}
.roomGroup .taskContent{min-height:49px;padding:6px 9px;border:0;border-bottom:1px solid #f0e8df;border-radius:0}
.roomGroup .task:last-child .taskContent{border-bottom:0}

.dailyRoutineHead{gap:6px;padding:5px 3px 6px;font-size:12px}
.dailyRoutineGroup .task{min-height:47px}
.result{padding:7px 1px;gap:6px}
.resultText b{font-size:13px;line-height:1.18}
.result .meta{font-size:10px}

body{background:radial-gradient(circle at 90% 0%,#fbf8f3 0,#f7f2eb 42%,#f3ece3 100%);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
.app{max-width:760px;padding:18px 14px 80px}.brand{font-size:14px;letter-spacing:.01em;color:#8d8075;margin:4px 3px 1px}h1{font-family:Georgia,"Times New Roman",serif;font-size:38px;font-weight:500;letter-spacing:-1px;margin:0 3px 14px;color:#3a332d}
.tabs{gap:6px;margin:0 0 13px;padding:0 2px 3px;overflow-x:auto;flex-wrap:nowrap}.tab{border:1px solid #e5d9cd;background:rgba(255,253,249,.8);padding:8px 13px;border-radius:14px;font-size:13px;font-weight:650;color:#75695f;box-shadow:none}.tab.active{background:#a28d7b;color:#fff;border-color:#a28d7b;box-shadow:0 4px 10px rgba(100,75,55,.12)}
.card{border:1px solid #e6dbd0;border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);background:rgba(255,253,249,.9)}.hero{padding:14px 15px}.hero .topline{align-items:flex-start}.hero h2{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:25px}.badge{padding:7px 10px;border-radius:13px;background:#f0e8de;color:#66594f;font-size:12px}.progress{height:7px;margin:11px 0;background:#eee6de}.actions{gap:6px;margin-top:9px}.btn{padding:8px 10px;border-radius:12px;font-size:12px;background:#fffdf9;color:#65594f}.notice{padding:11px 12px;border-radius:15px;margin-top:10px;font-size:13px}.sectionTitle{font-family:Georgia,"Times New Roman",serif;font-size:17px;font-weight:500;margin:17px 3px 7px;color:#4a4038}
.dailyRoutineGroup,.roomGroup,.catalogRoomGroup{border-radius:15px;box-shadow:0 5px 16px rgba(82,62,46,.035)}.dailyRoutineGroup{padding:5px 8px;margin-bottom:9px}.dailyRoutineHead{padding:5px 3px 7px;font-size:12px}.task{min-height:50px;margin:4px 0}.taskContent{min-height:50px;padding:7px 7px;gap:8px;border-radius:13px;background:#fffefa}.check{width:22px;height:22px;flex-basis:22px;border-width:1.7px}.taskName{font-size:14px;font-weight:650}.meta{font-size:10px;margin-top:2px}.taskButtons{gap:4px}.actionTextBtn{width:29px;height:29px;border-radius:9px;font-size:15px;background:#f0e8de;color:#695b50}.iconBtn{border-radius:9px;padding:6px 7px}.roomGroupHead,.catalogRoomHead{padding:8px 10px}.roomGroupCount{font-size:10px}.catalogRoomBody .result{padding:8px 10px}.search{padding:10px 12px;border-radius:13px}.catalogActions{gap:4px}.empty{padding:18px 8px}
@media(max-width:500px){.app{padding:14px 11px 70px}h1{font-size:35px;margin-bottom:11px}.tab{padding:7px 11px;font-size:12px}.card{padding:12px}.hero{padding:12px 13px}.taskContent{padding:6px 6px}.actionTextBtn{width:28px;height:28px;font-size:14px}.taskButtons{gap:3px}}

</style>
</head>
<body>
<div class="app"><div class="brand"> Unser Zuhause</div><h1>Haushaltsplan</h1>
<div class="tabs"><button class="tab active" data-tab="today">Heute</button><button class="tab" data-tab="week"> Bald fällig</button><button class="tab" data-tab="calendar"> Kalender</button><button class="tab" data-tab="catalog"> Aufgabenkatalog</button></div>
<main id="main"></main><footer>Flexibel statt perfekt. Ein ausgelassener Tag wird nicht automatisch nachgeholt. </footer></div>
<div class="detailOverlay" id="detailOverlay"><div class="sheet"><div class="sheetTop"><div><div class="small" id="detailMeta"></div><h2 id="detailTitle"></h2></div><button class="close" id="closeDetail">×</button></div><div id="detailContent"></div></div></div><div class="toast" id="toast"></div>
<script src="app.js?v=290"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").then(r=>r.update()).catch(()=>{});}</script>
</body></html>
