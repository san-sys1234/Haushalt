<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Unser Zuhause">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <title>Unser Zuhause</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">⌂</span><div><strong>Unser Zuhause</strong><small>V2 · Haushaltsorganisation</small></div></div>
    <button class="icon-button" id="backupBtn" aria-label="Datensicherung">⇧</button>
  </header>
  <main id="app" aria-live="polite">
    <section class="loading"><div class="spinner"></div><p>Dein Zuhause wird vorbereitet …</p></section>
  </main>
  <nav class="tabbar" aria-label="Hauptnavigation">
    <button data-tab="today" class="active"><span>☀</span><small>Heute</small></button>
    <button data-tab="calendar"><span>▦</span><small>Kalender</small></button>
    <button data-tab="catalog"><span>☷</span><small>Aufgaben</small></button>
    <button data-tab="rooms"><span>⌂</span><small>Räume</small></button>
    <button data-tab="settings"><span>⚙</span><small>Mehr</small></button>
  </nav>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <dialog id="taskDialog" class="modal"><form method="dialog" id="taskForm"><div class="modal-head"><div><small id="taskEyebrow">AUFGABE</small><h2 id="taskTitle">Aufgabe bearbeiten</h2></div><button class="icon-button" value="cancel" aria-label="Schließen">×</button></div><input type="hidden" id="taskId"><label>Aufgabe<input id="taskText" required maxlength="180"></label><div class="form-grid"><label>Raum<select id="taskRoom"></select></label><label>Intervall in Tagen<input id="taskInterval" type="number" min="1" max="3650" required></label><label>Nächster Termin<input id="taskDate" type="date" required></label><label>Aufwand (Minuten)<input id="taskMinutes" type="number" min="1" max="240" required></label></div><label class="checkline"><input id="taskHygiene" type="checkbox"> Hygieneaufgabe (darf Zeitlimit überschreiten)</label><div class="modal-actions"><button type="button" class="button ghost" id="deleteTaskBtn">Löschen</button><button class="button primary" id="saveTaskBtn" value="default">Speichern</button></div></form></dialog>
  <dialog id="dayDialog" class="modal"><form method="dialog"><div class="modal-head"><div><small id="dayEyebrow">TAG</small><h2 id="dayTitle">Tagesübersicht</h2></div><button class="icon-button" value="cancel">×</button></div><div id="dayContent"></div><div class="modal-actions"><button class="button ghost" id="freeDayToggle" type="button">Als haushaltsfrei markieren</button><button class="button primary" value="cancel">Schließen</button></div></form></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js" defer></script>
</body>
</html>
